codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: 50..80

  status:
    patch:
      default:
        target: 30%
        threshold: 2%

comment:
  layout: "header, diff, flags, components"
  require_changes: false

flag_management:
  default_rules:
    carryforward: true

  individual_flags:
    - name: backend
      paths:
        - server/**
      carryforward: true

    - name: frontend
      paths:
        - client/**
      carryforward: true

component_management:
  individual_components:
    - component_id: backend
      name: Backend Overall
      paths:
        - server/**
      statuses:
        - type: project
          target: 80%
          threshold: 2%

    - component_id: backend_core
      name: Backend Core (Domain & Shared)
      paths:
        - server/**/domain/**
        - server/maconi-shared/**
      statuses:
        - type: project
          target: 98%
          threshold: 1%

    - component_id: backend_application
      name: Backend Application Layer
      paths:
        - server/**/application/**
      statuses:
        - type: project
          target: 80%
          threshold: 2%

    - component_id: backend_infra
      name: Backend Infrastructure
      paths:
        - server/**/infra/**
      statuses:
        - type: project
          target: 60%
          threshold: 5%

    - component_id: frontend
      name: Frontend Overall
      paths:
        - client/**
      statuses:
        - type: project
          target: 80%
          threshold: 5%
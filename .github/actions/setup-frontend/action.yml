name: 'Setup Node.js for frontend'
description: 'Configures Node.js 20 with npm caching'

runs:
  using: composite

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: 'client/package-lock.json'
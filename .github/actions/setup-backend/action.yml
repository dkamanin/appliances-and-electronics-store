name: 'Setup Java & Gradle for backend'
description: 'Configures Java 21 and Gradle with caching'

runs:
  using: composite

  steps:
  - name: Setup Java 21
    uses: actions/setup-java@v5
    with:
      java-version: '21'
      distribution: 'temurin'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v6
    with:
      cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      cache-cleanup: on-success

    # --- Caching Provider Notes ---
    # By default, the action uses Enhanced Caching via `gradle-actions-caching`
    # which is free for open-source projects. For private repos, it's currently in "Free Preview".
    #
    # Enhanced Caching supports advanced features like cache-cleanup.
    #
    # To avoid potential vendor lock-in or future licensing costs in private repositories,
    # you can switch to the fully open-source (MIT) Basic Caching provider:
    #
    #   cache-provider: basic
    #
    # Note: When using `cache-provider: basic`, the `cache-cleanup` option
    # and other Enhanced Caching features are ignored.
    #
    # Documentation: https://github.com/gradle/actions/blob/main/docs/setup-gradle.md

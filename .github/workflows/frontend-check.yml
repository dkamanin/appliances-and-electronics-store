  frontend-ci-success:
    needs: [paths-filter, frontend-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check pipeline status
        run: |
          echo "Checking results..."
          echo "Lint: ${{ needs.frontend-lint.result }}"

          if [[ "${{ needs.frontend-lint.result }}" == "failure" ]]; then
            echo "⚠️  WARNING: Frontend linting failed."
            echo "This is known legacy debt. See Issue #11."
            echo "The PR is not blocked, but please fix this eventually."
          fi

          # Uncomment this block once the 'frontend-test' job is enabled.
          # Also remember to add 'frontend-test' to the 'needs' section above.

          # if [[ "${{ needs.frontend-test.result }}" == "failure" ]]; then
          #   echo "❌ One of the required jobs failed!"
          #   exit 1
          # fi

          if [[ "${{ needs.frontend-lint.result }}" == "cancelled" ]]; then
            echo "❌ Pipeline was cancelled!"
            exit 1
          fi

          echo "✅ All relevant jobs passed or were skipped (Legacy lint ignored)."
name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  paths-filter:
    uses: ./.github/workflows/paths-filter.yml

  frontend-lint:
    needs: paths-filter
    if: needs.paths-filter.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: ./.github/actions/setup-frontend

      - name: Install dependencies
        run: npm ci

      - name: Linting
        run: npm run lint


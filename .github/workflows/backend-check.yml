name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'server/**'
      - '.github/workflows/backend-check.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/backend-check.yml'

permissions:
  contents: read

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-backend

      - name: Code format check
        run: ./gradlew spotlessCheck

      - name: Linting (Main + Test)
        run: |
          ./gradlew checkstyleMain
          ./gradlew checkstyleTest
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java and Gradle
        uses: ./.github/actions/setup-backend

      - name: Run tests and check coverage verification
        run: ./gradlew test jacocoTestCoverageVerification

      - name: Generate coverage report
        run: ./gradlew jacocoAggregatedReport

      - name: Upload coverage to Codecov
        if: ${{ !github.event.pull_request || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/jacoco/jacocoAggregatedReport/jacocoAggregatedReport.xml
          flags: backend
          name: backend
          fail_ci_if_error: true
          verbose: false